
[package]
name = "core"
version = "1.0.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["serde", "v4"] }
tempfile = "3"
time = "0.3"
which = "8.0.0"
image = "0.25"
base64 = "0.22"
ttf-parser = "0.25.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
