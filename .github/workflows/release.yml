name: Release

# Builds the native PySide6 + Rust app (macOS arm64 only for now — that's
# the only platform this app currently targets: Orukeet and ffmpeg are
# bundled for macOS arm64, and rendering uses VideoToolbox hardware
# encoding). Windows/Linux packaging is future work.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # build and sign only; the release job runs for tags

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15 # Apple Silicon runner; Whisper runtime targets macOS 15+

    steps:
      - uses: actions/checkout@v4

      - name: Check signing and notarization secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD \
            APPLE_ID APPLE_APP_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build Rust core
        working-directory: rust
        run: cargo build --release

      - name: Download bundled ffmpeg/ffprobe
        run: bash scripts/download-binaries.sh
        env:
          TARGET_OS: macOS

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync

      - name: Build Tekstitys.app
        working-directory: pyside
        run: uv run --with pyinstaller pyinstaller tekstitys.spec --noconfirm

      - name: Smoke-test the bundled core binary
        run: |
          CORE="pyside/dist/Tekstitys.app/Contents/Frameworks/rust/target/release/core"
          echo '{"id":"ci","method":"ping","params":{}}' | "$CORE" | grep -q '"ok":true'

      - name: Smoke-test the bundled agent CLI
        run: |
          CLI="pyside/dist/Tekstitys.app/Contents/MacOS/TekstitysCLI"
          "$CLI" --help

      - name: Smoke-test the bundled Whisper CLI
        run: |
          CLI="pyside/dist/Tekstitys.app/Contents/Frameworks/rust/bin/whisper-cli-macos-arm64"
          LIBS="pyside/dist/Tekstitys.app/Contents/Frameworks/rust/bin/lib/libinternal"
          DYLD_LIBRARY_PATH="$LIBS" "$CLI" --help >/dev/null

      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          cert="$RUNNER_TEMP/build_certificate.p12"
          keychain="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 -D -o "$cert"
          export KEYCHAIN_PATH="$keychain" CERTIFICATE_PATH="$cert"
          export KEYCHAIN_PASSWORD="$KEYCHAIN_PASSWORD" P12_PASSWORD="$P12_PASSWORD"
          python3 scripts/macos_ci_credentials.py import-certificate
          rm -f "$cert"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

      - name: Sign Tekstitys.app
        working-directory: pyside/dist
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Olli Sulopuisto (LWSR8T5392)"
        run: |
          set -euo pipefail
          # Sign nested Mach-O files first (deepest paths first), then the bundle itself.
          find Tekstitys.app -type f -print0 | while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q 'Mach-O'; then
              printf '%s\t%s\n' "$(printf '%s' "$f" | awk -F/ '{print NF}')" "$f"
            fi
          done | sort -t "$(printf '\t')" -k1,1nr | cut -f2- | while IFS= read -r f; do
            codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" "$f"
          done
          codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" Tekstitys.app
          codesign --verify --deep --strict --verbose=2 Tekstitys.app

      - name: Create macOS disk image
        working-directory: pyside/dist
        run: |
          mkdir installer
          ditto Tekstitys.app installer/Tekstitys.app
          ln -s /Applications installer/Applications
          hdiutil create -volname "Tekstitys" -srcfolder installer -ov -format UDZO Tekstitys-macos-arm64.dmg
          codesign --force --timestamp --sign "Developer ID Application: Olli Sulopuisto (LWSR8T5392)" Tekstitys-macos-arm64.dmg
          codesign --verify --verbose=2 Tekstitys-macos-arm64.dmg

      - name: Notarize and staple disk image
        working-directory: pyside/dist
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          export KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          export APPLE_TEAM_ID="${APPLE_TEAM_ID:-LWSR8T5392}"
          python3 "$GITHUB_WORKSPACE/scripts/macos_ci_credentials.py" store-notary-credentials
          xcrun notarytool submit Tekstitys-macos-arm64.dmg \
            --keychain-profile ci-notary --keychain "$KEYCHAIN_PATH" \
            --wait
          xcrun stapler staple Tekstitys-macos-arm64.dmg
          xcrun stapler validate Tekstitys-macos-arm64.dmg

      - name: Remove signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/build_certificate.p12"
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tekstitys-macos-arm64
          path: pyside/dist/Tekstitys-macos-arm64.dmg

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Tekstitys-macos-arm64
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          body: |
            macOS (Apple Silicon) build, signed with a Developer ID
            Application certificate and notarized by Apple. The notarization
            ticket is stapled to the disk image.

            See CHANGELOG.md for what's in this release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
