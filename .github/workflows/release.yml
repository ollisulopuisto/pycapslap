name: Release

# Builds the native PySide6 + Rust app (macOS arm64 only for now — that's
# the only platform this app currently targets: Orukeet and ffmpeg are
# bundled for macOS arm64, and rendering uses VideoToolbox hardware
# encoding). Windows/Linux packaging is future work.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # build and sign only; the release job runs for tags

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15 # Apple Silicon runner; Whisper runtime targets macOS 15+

    steps:
      - uses: actions/checkout@v4

      - name: Check signing and notarization secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD \
            APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID APPLE_NOTARY_PRIVATE_KEY_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build Rust core
        working-directory: rust
        run: cargo build --release

      - name: Download bundled ffmpeg/ffprobe
        run: bash scripts/download-binaries.sh
        env:
          TARGET_OS: macOS

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync

      - name: Build PyCapSlap.app
        working-directory: pyside
        run: uv run --with pyinstaller pyinstaller pycapslap.spec --noconfirm

      - name: Smoke-test the bundled core binary
        run: |
          CORE="pyside/dist/PyCapSlap.app/Contents/Frameworks/rust/target/release/core"
          echo '{"id":"ci","method":"ping","params":{}}' | "$CORE" | grep -q '"ok":true'

      - name: Smoke-test the bundled agent CLI
        run: |
          CLI="pyside/dist/PyCapSlap.app/Contents/MacOS/PyCapSlapCLI"
          "$CLI" --help

      - name: Smoke-test the bundled Whisper CLI
        run: |
          CLI="pyside/dist/PyCapSlap.app/Contents/Frameworks/rust/bin/whisper-cli-macos-arm64"
          LIBS="pyside/dist/PyCapSlap.app/Contents/Frameworks/rust/bin/lib/libinternal"
          DYLD_LIBRARY_PATH="$LIBS" "$CLI" --help >/dev/null

      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          cert="$RUNNER_TEMP/build_certificate.p12"
          keychain="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 -D -o "$cert"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$cert" -P "$P12_PASSWORD" -T /usr/bin/codesign -f pkcs12 -k "$keychain"
          rm -f "$cert"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

      - name: Sign PyCapSlap.app
        working-directory: pyside/dist
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Olli Sulopuisto (LWSR8T5392)"
        run: |
          set -euo pipefail
          # Sign nested Mach-O files first (deepest paths first), then the bundle itself.
          find PyCapSlap.app -type f -print0 | while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q 'Mach-O'; then
              printf '%s\t%s\n' "$(printf '%s' "$f" | awk -F/ '{print NF}')" "$f"
            fi
          done | sort -t "$(printf '\t')" -k1,1nr | cut -f2- | while IFS= read -r f; do
            codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" "$f"
          done
          codesign --force --timestamp --options runtime --sign "$APPLE_SIGNING_IDENTITY" PyCapSlap.app
          codesign --verify --deep --strict --verbose=2 PyCapSlap.app

      - name: Prepare App Store Connect API key
        env:
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          echo -n "$APPLE_NOTARY_PRIVATE_KEY_BASE64" | base64 -D -o "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Create macOS disk image
        working-directory: pyside/dist
        run: |
          mkdir installer
          ditto PyCapSlap.app installer/PyCapSlap.app
          ln -s /Applications installer/Applications
          hdiutil create -volname "PyCapSlap" -srcfolder installer -ov -format UDZO PyCapSlap-macos-arm64.dmg
          codesign --force --timestamp --sign "Developer ID Application: Olli Sulopuisto (LWSR8T5392)" PyCapSlap-macos-arm64.dmg
          codesign --verify --verbose=2 PyCapSlap-macos-arm64.dmg

      - name: Notarize and staple disk image
        working-directory: pyside/dist
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool submit PyCapSlap-macos-arm64.dmg \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple PyCapSlap-macos-arm64.dmg
          xcrun stapler validate PyCapSlap-macos-arm64.dmg

      - name: Remove signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/build_certificate.p12"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyCapSlap-macos-arm64
          path: pyside/dist/PyCapSlap-macos-arm64.dmg

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: PyCapSlap-macos-arm64
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          body: |
            macOS (Apple Silicon) build, signed with a Developer ID
            Application certificate and notarized by Apple. The notarization
            ticket is stapled to the disk image.

            See CHANGELOG.md for what's in this release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
