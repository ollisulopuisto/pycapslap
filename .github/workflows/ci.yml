name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Rust lint
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Download bundled ffmpeg/ffprobe/whisper-cli
        run: bash scripts/download-binaries.sh
        env:
          TARGET_OS: macOS

      - name: Rust test
        working-directory: rust
        run: cargo test --release

  pyside:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build Rust core (needed by pyside tests that spawn it)
        working-directory: rust
        run: cargo build --release

      - name: Download bundled ffmpeg/ffprobe/whisper-cli
        run: bash scripts/download-binaries.sh
        env:
          TARGET_OS: macOS

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: pytest
        # A 120s per-test cap: test_main_window_save_action loads a
        # deliberately-garbage "video" file into a real QMediaPlayer, which
        # hangs indefinitely on a GitHub-hosted runner's non-interactive
        # session (reproduced locally too under QT_QPA_PLATFORM=offscreen —
        # that's not a fix here, it hangs the same test a different way).
        # Bounding it turns a stuck 30-60+ minute run into a fast, visible
        # failure instead; fixing the test itself (e.g. mocking QMediaPlayer)
        # is follow-up work.
        run: uv run python -m pytest --timeout=120

