name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Rust lint
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Download bundled ffmpeg/ffprobe/whisper-cli
        run: bash scripts/download-binaries.sh
        env:
          TARGET_OS: macOS

      - name: Rust test
        working-directory: rust
        run: cargo test --release

  pyside:
    runs-on: macos-latest
    # Backstop for the pytest step: two known-hanging tests are already
    # skipped (see test_main_window.py), but if another one like it turns up,
    # this is the one mechanism actually guaranteed to cut it off — the
    # per-test pytest-timeout default (pyproject.toml) did not reliably
    # interrupt the ones already found.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build Rust core (needed by pyside tests that spawn it)
        working-directory: rust
        run: cargo build --release

      - name: Download bundled ffmpeg/ffprobe/whisper-cli
        run: bash scripts/download-binaries.sh
        env:
          TARGET_OS: macOS

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: pytest
        # Two tests are skipped unconditionally (see test_main_window.py) —
        # they hang under pytest specifically, reproducibly, even run alone;
        # the job-level timeout-minutes above is the real backstop in case
        # that turns out not to be the only one.
        run: uv run python -m pytest

